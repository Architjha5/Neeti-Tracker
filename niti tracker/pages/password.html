<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niti Tracker - Complete Profile</title>

<link rel="stylesheet" href="../css/password.css">

</head>

<body>

<main class="password-container">

    <section class="password-card">

        <div class="logo-circle">
            <span>NT</span>
        </div>

        <h1>Complete Your Profile</h1>

        <p class="subtitle">
            Enter your information to continue to Niti Tracker.
        </p>

        <form id="password-form">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="show-password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="continue-btn"
            >
                Continue
            </button>


            <p id="password-message"></p>

        </form>


        <p class="security-note">
            Your role is assigned by the Niti Tracker administrator.
        </p>

    </section>

</main>


<script src="../js/password.js"></script>

</body>

</html>
